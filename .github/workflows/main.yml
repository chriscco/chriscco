name: Personal coding stats

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

permissions:
  contents: write

concurrency:
  group: personal-coding-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/waka-readme-stats
          ref: 7bd27cc70d59d33ea66ebe4c485fc2d75ecdffb6
          path: generator
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: generator/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: generator
      - name: Diagnose Gitea connection
        env:
          GITEA_URL: ${{ vars.GITEA_API_URL }}
        run: |
          python - <<'PYCODE'
          import os, socket, urllib.request, urllib.error
          from urllib.parse import urlsplit
          url = os.environ['GITEA_URL']
          host = urlsplit(url).hostname
          try:
              print('DNS:', sorted({r[4][0] for r in socket.getaddrinfo(host,443)}))
              with urllib.request.urlopen(url.rstrip('/')+'/api/v1/version',timeout=15) as response:
                  print('Unauthenticated HTTPS status:',response.status)
          except Exception as error:
              print(type(error).__name__, str(error))
              raise SystemExit(1)
          PYCODE
      - name: Generate and publish profile statistics
        working-directory: generator
        env:
          INPUT_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          INPUT_GITEA_API_URL: ${{ vars.GITEA_API_URL }}
          INPUT_GITEA_API_TOKEN: ${{ secrets.GITEA_API_TOKEN }}
          INPUT_GH_USER: ${{ github.repository_owner }}
          INPUT_PUSH_TOKEN: ${{ github.token }}
          INPUT_WAKATIME_API_URL: ${{ vars.CODING_API_URL }}
          INPUT_WAKATIME_API_KEY: ${{ secrets.CODING_API_KEY }}
          INPUT_SHOW_CODING_HEATMAP: 'True'
          INPUT_SHOW_LANGUAGE: 'True'
          INPUT_SHOW_EDITORS: 'True'
          INPUT_SHOW_TOTAL_CODE_TIME: 'True'
          INPUT_SHOW_AI_CODE_TIME: 'False'
          INPUT_SHOW_AI_CODING: 'False'
          INPUT_SHOW_PROJECTS: 'False'
          INPUT_SHOW_OS: 'False'
          INPUT_SHOW_TIMEZONE: 'False'
          INPUT_SHOW_COMMIT: 'True'
          INPUT_SHOW_DAYS_OF_WEEK: 'True'
          INPUT_SHOW_LANGUAGE_PER_REPO: 'True'
          INPUT_SHOW_LINES_OF_CODE: 'False'
          INPUT_SHOW_LOC_CHART: 'False'
          INPUT_SHOW_PROFILE_VIEWS: 'False'
          INPUT_SHOW_SHORT_INFO: 'False'
          INPUT_FORCE_ADD: 'True'
        run: python sources/main.py
